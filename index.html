en you get there,","startTime":33.86,"finishTime":34.799},{"text":"you'll be able to see farther.","startTime":34.939,"finishTime":36.419}]}},"MxGgfQXQzv7pZA4u7":{"_id":"MxGgfQXQzv7pZA4u7","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1370304,"uploadedFileName":"Alloy-en-Using11MeetingstoBuildIntimacyTrust-5122026.mp3","uploadedFileNameExtension":".mp3","duration":57.0625},"dates":{"dateCreated":"2026-05-12T17:23:14.234Z","dateModified":"2026-05-12T17:24:16.744Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"“One of the best ways to build and sustain intimacy is through regular one to one meetings. These conversations help create a strong balance between the human connection and the business connection.\n\nThey’re an opportunity to better understand your people—not just their work, but their experiences, challenges, and motivations. In the last session, you identified several powerful questions that can help open up those conversations, like asking about roadblocks, concerns, how you can support their needs, what a good day looks like, or what they enjoy most about their role.\n\nBuilding intimacy in one to ones also comes down to how you show up. Here are some more strategies you can use in these meetings. Be present, listen carefully, and follow up on what people share. Create space for honest conversations, not just task updates. Over time, these small, consistent moments of connection help build trust and stronger working relationships.”","voiceCode":"en-US-AlloyTurboMultilingualNeural","language":"en","originalResourceId":"3c4BFfQddndtY4nXx","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo= leData":false,"_siteID":"g7KiRFsys4vhsx3dA","source":"ai","voiceOver":{"voiceEditorContent":"{\"root\":{\"children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"“In our session in April, we spent time exploring leadership styles as a way to deepen both self-awareness and how we work together.\",\"type\":\"text\",\"version\":1}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"DiSC gives us a shared language for understanding our natural tendencies—how we communicate, make decisions, and respond to change. Individually, it highlights our strengths. Collectively, it helps us see the capability of the team as a whole.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"There’s no best style. The real value comes from using our differences intentionally—leaning into our own strengths, relying on others where their style fits best, and closing gaps together.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":1}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Leading self, and leading as a team, means using DiSC to work smarter—together.”\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-AlloyTurboMultilingualNeural\",\"rate\":0.9}}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"“In our session in April, we spent time exploring leadership styles as a way to deepen both self-awareness and how we work together.\n\nDiSC gives us a shared language for understanding our natural tendencies—how we communicate, make decisions, and respond to change. Individually, it highlights our strengths. Collectively, it helps us see the capability of the team as a whole.\n\nThere’s no best style. The real value comes from using our differences intentionally—leaning into our own strengths, relying on others where their style fits best, and closing gaps together.\n\nLeading self, and leading as a team, means using DiSC to work smarter—together.”","jobId":"8Y8Eubfvf6nbdP4du","voiceCodeUsed":"en-US-AlloyTurboMultilingualNeural","featureAdoption":{"isAddingPauses":false,"isAdjustingSpeed":true,"isUsingMultipleVoices":false}}},"hNKNtCZgZbw5vdCML":{"_id":"hNKNtCZgZbw5vdCML","data":{"attributes":{"title":"Core Concepts and Benefits","template":"resourceSlide","locale":"en","upload":"zhMxHgXf7HRDNiu3a"},"video":{"autoPlay":true,"overlays":[{"htmlContent":"\u003cdiv>Why Intimacy Matters Most\u003c/div>\n","customStyle":{"font":{"size":25,"bold":true,"italic":false,"underline":false},"textHeading":"heading1","verticalAlignment":"middle","lineHeight":1.2,"fontColor":"koantic(accent1, 0, 1)","type":"rectangle","textAlignment":"left","border":{"colo
